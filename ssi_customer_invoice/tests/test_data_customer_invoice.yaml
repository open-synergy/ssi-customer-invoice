        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the invoice and post the journal entry"
        action: "call"
        target: "invoice"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Get the invoice's receivable journal item"
        action: "search"
