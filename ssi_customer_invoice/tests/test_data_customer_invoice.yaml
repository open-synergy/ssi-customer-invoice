          - ["id", "=", "REC: invoice.receivable_move_line_id.id"]
        save_as: "receivable_ml"
        expect_count: 1

      - step: "Create a manual payment entry crediting the receivable account"
        action: "create"
        model: "account.move"
        save_as: "payment_move"
        values:
          journal_id: "REC: general_journal.id"
          date: 2024-02-01
          line_ids:
            - - 0
              - 0
              - name: "Payment"
                account_id: "REC: account.id"
