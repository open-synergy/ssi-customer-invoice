options:
  auto_refresh: true

setup:
  steps:
    - step: "Get receivable account type"
      action: "ref"
      xml_id: "account.data_account_type_receivable"
      save_as: "receivable_acc_type"

    - step: "Get revenue account type"
      action: "ref"
      xml_id: "account.data_account_type_revenue"
      save_as: "income_acc_type"

    # `setup:` replays before every scenario in the same transaction (no
    # rollback in between), so a fixed `code` would collide with the
    # previous scenario's record on the 2nd+ replay (code is unique per
    # company). Generate a fresh, never-colliding code/name on each replay.
    - step: "Create receivable account"
      action: "create"
      model: "account.account"
      save_as: "account"
      values:
        code: "EVAL: 'CI%d' % env['account.account'].search_count([])"
        name: "Test Customer Invoice Receivable"
        user_type_id: "REC: receivable_acc_type.id"
        reconcile: true

    # `account_id` on a detail line (mixin.product_line_account) is
    # required=True; a handful of scenarios below need one to actually
    # open the invoice (post_open now creates a journal entry from
    # line_ids).
    - step: "Create line income account"
      action: "create"
      model: "account.account"
      save_as: "line_account"
      values:
        code: "EVAL: 'CIHE%d' % env['account.account'].search_count([])"
        name: "Test Customer Invoice Header Income"
        user_type_id: "REC: income_acc_type.id"

    # Contra side of the manually-created payment entries used to exercise
    # the realized/reconciliation automation -- any non-reconcile account
    # works, its own type does not matter for these scenarios.
    - step: "Create a contra account for manual payment entries"
      action: "create"
      model: "account.account"
      save_as: "contra_account"
      values:
        code: "EVAL: 'CICT%d' % env['account.account'].search_count([])"
        name: "Test Customer Invoice Contra"
        user_type_id: "REC: income_acc_type.id"

    - step: "Create sale journal"
      action: "create"
      model: "account.journal"
      save_as: "journal"
      values:
        name:
          "EVAL: 'Test Customer Invoice Sale Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'CIJ%d' % env['account.journal'].search_count([])"
        type: "sale"

    - step: "Create a general journal for manual payment entries"
      action: "create"
      model: "account.journal"
      save_as: "general_journal"
      values:
        name:
          "EVAL: 'Test Customer Invoice General Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'CIGJ%d' % env['account.journal'].search_count([])"
        type: "general"

    - step: "Create customer invoice type"
      action: "create"
      model: "customer_invoice_type"
      save_as: "type"
      values:
        name: "Test Customer Invoice Type"
        code: "/"
        journal_id: "REC: journal.id"
        receivable_account_id: "REC: account.id"

    - step: "Create customer partner"
      action: "create"
      model: "res.partner"
      save_as: "customer"
      values:
        name: "Test Customer Invoice Partner"
        is_company: true

scenarios:
  - name: "Create customer invoice in draft state"
    steps:
      - step: "Create customer invoice"
        action: "create"
        model: "customer_invoice"
        save_as: "invoice"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: customer.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: account.id"

      - step: "Assert created in draft with no document number yet"
        action: "assert"
        target: "invoice"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          name:
            type: "value"
            expected: "/"

  - name: "Create customer invoice without pricelist_id succeeds"
    steps:
      - step: "Create customer invoice omitting pricelist_id"
        action: "create"
        model: "customer_invoice"
        save_as: "invoice_no_pricelist"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: customer.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: account.id"

      - step: "Assert created in draft with pricelist_id left empty"
        action: "assert"
        target: "invoice_no_pricelist"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          pricelist_id:
            type: "value"
            expected: false

  - name: "Onchange type_id fills journal and receivable account"
    steps:
      - step: "Set type_id on a new form"
        action: "form"
        model: "customer_invoice"
        save: false
        ops:
          - set: {type_id: "REC: type"}
          - assert:
              journal_id:
                type: "m2o"
                expected: "REC: journal"
              receivable_account_id:
                type: "m2o"
                expected: "REC: account"

  - name: "Onchange duration and date fills date due"
    steps:
      - step: "Create a 7 calendar day duration"
        action: "create"
        model: "base.duration"
        save_as: "duration"
        values:
          name: "Test Customer Invoice Duration 7 Days"
          code: "/"
          relative_delta_days: 7
          number_of_days: 0

      - step: "Set date then duration_id on a new form"
        action: "form"
        model: "customer_invoice"
        save: false
        ops:
          - set: {date: 2024-01-01}
          - set: {duration_id: "REC: duration"}
          - assert:
              date_due:
                type: "value"
                expected: 2024-01-08

  - name: "Compute allowed currency ids from type's manual currency list"
    steps:
      # SGD is inactive by default on a fresh database; a manual m2m list
      # only shows up on read once its currency is active (Odoo filters
      # x2many reads by `active` unless told otherwise), so activate it
      # first -- exactly what a real user would do in Settings.
      - step: "Get SGD currency"
        action: "ref"
        xml_id: "base.SGD"
        save_as: "sgd_currency"

      - step: "Activate SGD so it can appear in the manual currency list"
        action: "write"
        target: "sgd_currency"
        values:
          active: true

      - step: "Create a second customer invoice type with a manual currency allow-list"
        action: "create"
        model: "customer_invoice_type"
        save_as: "manual_currency_type"
        values:
          name: "Test Customer Invoice Type Manual Currency"
          code: "/"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: account.id"
          currency_selection_method: "manual"
          currency_ids:
            - - 6
              - 0
              - - "REF: base.EUR"
                - "REF: base.SGD"

      - step: "Create customer invoice using that type"
        action: "create"
        model: "customer_invoice"
        save_as: "invoice"
        values:
          type_id: "REC: manual_currency_type.id"
          partner_id: "REC: customer.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: account.id"

      - step: "Assert allowed_currency_ids is exactly the manual list"
        action: "assert"
        target: "invoice"
        asserts:
          allowed_currency_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "RECORDSET: base.EUR"
              - "RECORDSET: base.SGD"

  - name:
      "Confirm then approve moves invoice from draft to open, assigns a document number,
      and posts a journal entry"
    steps:
      - step: "Create customer invoice"
        action: "create"
        model: "customer_invoice"
        save_as: "invoice"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: customer.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: account.id"

      - step: "Create a detail line so the invoice has something to post"
        action: "create"
        model: "customer_invoice.line"
        save_as: "line"
        values:
          customer_invoice_id: "REC: invoice.id"
          name: "Line"
          account_id: "REC: line_account.id"
          uom_quantity: 1
          price_unit: 150000.0

      - step: "Confirm the invoice"
        action: "call"
        target: "invoice"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the invoice"
        action: "call"
        target: "invoice"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert a document number was assigned on open"
        action: "assert"
        target: "invoice"
        refresh: true
        asserts:
          name:
            type: "value"
            operator: "not_equals"
            expected: "/"

      - step: "Assert a posted journal entry with the receivable move line was created"
        action: "assert"
        target: "invoice"
        refresh: true
        asserts:
          move_id:
            type: "value"
            operator: "is_truthy"
          move_id.state:
            type: "value"
            expected: "posted"
          receivable_move_line_id:
            type: "value"
            operator: "is_truthy"
          receivable_move_line_id.date_maturity:
            type: "value"
            expected: 2024-02-15

  - name: "Opening the invoice sets partner_id on the generated account.move header"
    steps:
      - step: "Create customer invoice"
        action: "create"
        model: "customer_invoice"
        save_as: "invoice"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: customer.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: account.id"

      - step: "Create a detail line so the invoice has something to post"
        action: "create"
        model: "customer_invoice.line"
        save_as: "line"
        values:
          customer_invoice_id: "REC: invoice.id"
          name: "Line"
          account_id: "REC: line_account.id"
          uom_quantity: 1
          price_unit: 90000.0

      - step: "Confirm the invoice"
        action: "call"
        target: "invoice"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the invoice"
        action: "call"
        target: "invoice"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step:
          "The generated account.move header carries the same partner as the invoice"
        action: "assert"
        target: "invoice"
        refresh: true
        asserts:
          move_id.partner_id:
            type: "m2o"
            expected: "REC: customer"

  - name:
      "Done is rejected on an open invoice whose receivable journal item is not
      reconciled yet"
    steps:
      - step: "Create customer invoice"
        action: "create"
        model: "customer_invoice"
        save_as: "invoice"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: customer.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: account.id"

      - step: "Create a detail line so the invoice stays open after approval"
        action: "create"
        model: "customer_invoice.line"
        save_as: "line"
        values:
          customer_invoice_id: "REC: invoice.id"
          name: "Line"
          account_id: "REC: line_account.id"
          uom_quantity: 1
          price_unit: 120000.0

      - step: "Confirm the invoice"
        action: "call"
        target: "invoice"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the invoice"
        action: "call"
        target: "invoice"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "The invoice carries an unreconciled journal entry"
        action: "assert"
        target: "invoice"
        refresh: true
        asserts:
          move_id:
            type: "value"
            operator: "is_truthy"
          realized:
            type: "value"
            expected: false

      - step: "Finishing the invoice by hand must be rejected"
        action: "call"
        target: "invoice"
        method: "action_done"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"

      - step: "The invoice is still unpaid"
        action: "assert"
        target: "invoice"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

  - name: "Restart moves invoice from reject back to draft"
    steps:
      - step: "Create customer invoice"
        action: "create"
        model: "customer_invoice"
        save_as: "invoice"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: customer.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: account.id"

      - step: "Confirm the invoice"
        action: "call"
        target: "invoice"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Reject the invoice"
        action: "call"
        target: "invoice"
        method: "action_reject_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "reject"

      - step: "Restart the invoice as validator"
        action: "call"
        target: "invoice"
        method: "action_restart"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Confirm is rejected for a user without the User group"
    steps:
      - step: "Create customer invoice"
        action: "create"
        model: "customer_invoice"
        save_as: "invoice"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: customer.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: account.id"

      - step: "Create a plain internal user without customer_invoice_user_group"
        action: "create"
        model: "res.users"
        save_as: "plain_user"
        values:
          name: "Customer Invoice Plain User"
          login:
            "EVAL: 'customer_invoice_plain_user_%d' % env['res.users'].search_count([])"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"

      - step: "Confirm as plain user must be rejected"
        action: "call"
        target: "invoice"
        method: "action_confirm"
        as_user: "plain_user"
        expect_error:
          type: "UserError"

  - name: "Done is rejected while invoice is still draft"
    steps:
      - step: "Create customer invoice"
        action: "create"
        model: "customer_invoice"
        save_as: "invoice"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: customer.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: account.id"

      - step: "Done while still draft must be rejected"
        action: "call"
        target: "invoice"
        method: "action_done"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"

  - name: "Company-scoped user cannot see an invoice owned by another company"
    steps:
      - step: "Create another company"
        action: "create"
        model: "res.company"
        save_as: "other_company"
        values:
          name: "Test Customer Invoice Other Company"

      - step: "Create customer invoice owned by the other company"
        action: "create"
        model: "customer_invoice"
        save_as: "invoice"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: customer.id"
          company_id: "REC: other_company.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: account.id"

      - step:
          "Create a user scoped to the main company via customer_invoice_company_group"
        action: "create"
        model: "res.users"
        save_as: "company_user"
        values:
          name: "Customer Invoice Company User"
          login:
            "EVAL: 'customer_invoice_company_user_%d' %
            env['res.users'].search_count([])"
          company_id: "REC: company.id"
          company_ids:
            - - 6
              - 0
              - - "REC: company.id"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_customer_invoice.customer_invoice_company_group"

      - step: "Invoice owned by other company is not visible"
        action: "search"
        model: "customer_invoice"
        as_user: "company_user"
        domain:
          - ["id", "=", "REC: invoice.id"]
        save_as: "found"
        expect_count: 0

  - name: "Cancelling through the reason wizard moves invoice to cancel state"
    steps:
      - step: "Create customer invoice"
        action: "create"
        model: "customer_invoice"
        save_as: "invoice"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: customer.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: account.id"

      - step: "Create a cancel reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "reason"
        values:
          name: "Test Customer Invoice Cancel Reason"
          code: "/"

      - step: "Cancel through the reason wizard as validator"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "invoice"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: reason"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

  - name:
      "Approving an invoice without detail lines skips straight to Paid without a
      journal entry"
    steps:
      - step: "Create customer invoice without any detail lines"
        action: "create"
        model: "customer_invoice"
        save_as: "invoice"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: customer.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: account.id"

      - step: "Confirm the invoice"
        action: "call"
        target: "invoice"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approving the invoice skips straight to Paid"
        action: "call"
        target: "invoice"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "No journal entry was created"
        action: "assert"
        target: "invoice"
        refresh: true
        asserts:
          move_id:
            type: "value"
            operator: "is_falsy"

  - name:
      "Re-running action_open on an already open invoice does not duplicate the journal
      entry"
    steps:
      - step: "Create customer invoice"
        action: "create"
        model: "customer_invoice"
        save_as: "invoice"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: customer.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: account.id"

      - step: "Create a detail line"
        action: "create"
        model: "customer_invoice.line"
        save_as: "line"
        values:
          customer_invoice_id: "REC: invoice.id"
          name: "Line"
          account_id: "REC: line_account.id"
          uom_quantity: 1
          price_unit: 250000.0

      - step: "Confirm the invoice"
        action: "call"
        target: "invoice"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the invoice and post the journal entry"
        action: "call"
        target: "invoice"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Capture the journal entry created on open"
        action: "search"
        model: "account.move"
        domain:
          - ["id", "=", "REC: invoice.move_id.id"]
        save_as: "first_move"
        expect_count: 1

      - step: "Re-run action_open directly"
        action: "call"
        target: "invoice"
        method: "action_open"
        context:
          bypass_policy_check: true

      - step: "move_id is unchanged after re-running action_open"
        action: "assert"
        target: "invoice"
        refresh: true
        asserts:
          move_id:
            type: "m2o"
            expected: "REC: first_move"

      - step: "Only one journal entry exists for this invoice's journal"
        action: "search"
        model: "account.move"
        domain:
          - ["journal_id", "=", "REC: journal.id"]
        save_as: "moves_in_journal"
        expect_count: 1

  - name:
      "Cancelling an open invoice through the reason wizard deletes its journal entry"
    steps:
      - step: "Create customer invoice"
        action: "create"
        model: "customer_invoice"
        save_as: "invoice"
        values:
          type_id: "REC: type.id"
          partner_id: "REC: customer.id"
          date: 2024-01-15
          date_due: 2024-02-15
          currency_id: "REF: base.USD"
          pricelist_id: "REF: product.list0"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: account.id"

      - step: "Create a detail line"
        action: "create"
        model: "customer_invoice.line"
        save_as: "line"
        values:
