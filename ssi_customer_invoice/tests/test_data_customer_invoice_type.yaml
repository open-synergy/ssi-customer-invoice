options:
  auto_refresh: true

setup:
  steps:
    - step: "Get receivable account type"
      action: "ref"
      xml_id: "account.data_account_type_receivable"
      save_as: "receivable_acc_type"

    # `setup:` replays before every scenario in the same transaction (no
    # rollback in between), so a fixed `code` would collide with the
    # previous scenario's record on the 2nd+ replay (code is unique per
    # company). Generate a fresh, never-colliding code/name on each replay.
    - step: "Create receivable account"
      action: "create"
      model: "account.account"
      save_as: "receivable_account"
      values:
        code: "EVAL: 'CITR%d' % env['account.account'].search_count([])"
        name: "Customer Invoice Type Test Receivable"
        user_type_id: "REC: receivable_acc_type.id"
        reconcile: true

    - step: "Create sale journal"
      action: "create"
      model: "account.journal"
      save_as: "journal"
      values:
        name:
          "EVAL: 'Test Customer Invoice Type Sale Journal %d' %
          env['account.journal'].search_count([])"
        code: "EVAL: 'CITJ%d' % env['account.journal'].search_count([])"
        type: "sale"

    - step: "Create product 1"
      action: "create"
      model: "product.product"
      save_as: "product_1"
      values:
        name: "Customer Invoice Type Test Product 1"

    - step: "Create product 2"
      action: "create"
      model: "product.product"
      save_as: "product_2"
      values:
        name: "Customer Invoice Type Test Product 2"

scenarios:
  - name: "Create Customer Invoice Type"
    steps:
      - step: "Create type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "Test Customer Invoice Type"
          code: "CIT001"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"

      - step: "Assert type created and active"
        action: "assert"
        target: "ci_type"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Test Customer Invoice Type"
          active:
            type: "value"
            expected: true
          journal_id:
            type: "m2o"
            expected: "REC: journal"
          receivable_account_id:
            type: "m2o"
            expected: "REC: receivable_account"

  - name: "Edit and delete Customer Invoice Type"
    steps:
      - step: "Create type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "Editable Type"
          code: "CIT002"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"

      - step: "Write new name"
        action: "write"
        target: "ci_type"
        values:
          name: "Updated Type Name"

      - step: "Assert name updated"
        action: "assert"
        target: "ci_type"
        asserts:
          name:
            type: "value"
            expected: "Updated Type Name"

      - step: "Delete type"
        action: "unlink"
        target: "ci_type"

      - step: "Verify type deleted"
        action: "search"
        model: "customer_invoice_type"
        domain: [["code", "=", "CIT002"]]
        save_as: "result"
        expect_count: 0

  - name: "Selection method and configurator fields default to domain"
    steps:
      - step: "Create type without selection methods"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "Default Config Type"
          code: "CIT003"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"

      - step: "Assert all three selection methods default to domain"
        action: "assert"
        target: "ci_type"
        asserts:
          product_selection_method:
            type: "value"
            expected: "domain"
          product_domain:
            type: "value"
            expected: "[]"
          product_python_code:
            type: "value"
            expected: "result = []"
          currency_selection_method:
            type: "value"
            expected: "domain"
          currency_domain:
            type: "value"
            expected: "[]"
          currency_python_code:
            type: "value"
            expected: "result = []"
          pricelist_selection_method:
            type: "value"
            expected: "domain"
          pricelist_domain:
            type: "value"
            expected: "[]"
          pricelist_python_code:
            type: "value"
            expected: "result = []"

  - name: "Manual product selection stores the chosen products"
    steps:
      - step: "Create type with manual product selection"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "Manual Product Type"
          code: "CIT004"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"
          product_selection_method: "manual"
          product_ids:
            - - 6
              - 0
              - - "REC: product_1.id"
                - "REC: product_2.id"

      - step: "Assert both products are stored"
        action: "assert"
        target: "ci_type"
        asserts:
          product_selection_method:
            type: "value"
            expected: "manual"
          product_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: product_1"
              - "REC: product_2"

  # "Create without journal_id is rejected" is NOT expressible in YAML: a
  # missing required Many2one fails at the DB NOT NULL constraint
  # (psycopg2.errors.NotNullViolation), which is outside expect_error's 12
  # supported types (L-22). See test_customer_invoice_type.py
  # (test_create_without_journal_id_is_rejected, P5).

  - name: "Write an invalid selection value is rejected"
    steps:
      - step: "Create type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "Invalid Selection Type"
          code: "CIT006"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"

      - step: "Write an out-of-selection currency_selection_method must fail"
        action: "write"
        target: "ci_type"
        expect_error:
          type: "ValueError"
        values:
          currency_selection_method: "otomatis"

  - name:
      "Internal user without customer_invoice_type_group can read but not create
      (negative ACL)"
    steps:
      - step: "Create plain internal user (no customer_invoice_type group)"
        action: "create"
        model: "res.users"
        save_as: "no_group_user"
        values:
          name: "Plain Internal User Customer Invoice Type"
          login: "customer_invoice_type_no_group_user"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"

      - step: "Creating customer_invoice_type without the group raises AccessError"
        action: "create"
        model: "customer_invoice_type"
        as_user: "no_group_user"
        expect_error:
          type: "AccessError"
        values:
          name: "Denied Type"
          code: "CIT007"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"

      - step: "Create the same type as admin so it exists to be read"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "Readable Type"
          code: "CIT008"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"

      - step: "Reading the type without the group still succeeds"
        action: "call"
        target: "ci_type"
        method: "read"
        as_user: "no_group_user"
